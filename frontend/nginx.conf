
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # React frontend
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Backend API reverse proxy
    location /api/ {
        proxy_pass https://atsapi.happycliff-9a211783.eastus2.azurecontainerapps.io;

        # Enable TLS SNI for Azure Container Apps
        proxy_ssl_server_name on;
        proxy_ssl_name atsapi.happycliff-9a211783.eastus2.azurecontainerapps.io;

        proxy_http_version 1.1;

        # Forward the correct upstream hostname
        proxy_set_header Host atsapi.happycliff-9a211783.eastus2.azurecontainerapps.io;

        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 30s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
    }
}
